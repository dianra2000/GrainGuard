name: grainguard
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # syncfusion_flutter_charts: ^24.1.47 # Removed as requested
  firebase_core: ^2.24.0
  firebase_auth: ^4.18.1
  cloud_firestore: ^4.16.0
  shared_preferences: ^2.2.2
  firebase_database: ^10.5.7
  fl_chart: ^0.68.0 # Added fl_chart
  # Remove fluttertoast and use SnackBar instead


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/homeicon.png
    - assets/icons/plusicon.png
    - assets/icons/accounticon.png
    - assets/icons/historycharticon.png
    - assets/icons/chart.png
    - assets/icons/jar.jpg

  generate: true
